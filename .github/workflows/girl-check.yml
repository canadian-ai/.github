name: GIRL Check

on:
  workflow_call:
    inputs:
      path:
        description: Project path to check
        required: false
        type: string
        default: "."
      girl-version:
        description: GIRL module version (latest or vX.Y.Z)
        required: false
        type: string
        default: "latest"
      go-version:
        description: Go version used to install GIRL
        required: false
        type: string
        default: "1.25.x"
      node-version:
        description: Node.js version for JavaScript projects
        required: false
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  girl-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install project dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ inputs.path }}"
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun install --frozen-lockfile
          elif [[ -f pnpm-lock.yaml ]]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            corepack enable
            yarn install --immutable
          elif [[ -f package-lock.json ]]; then
            npm ci
          elif [[ -f package.json ]]; then
            npm install
          else
            echo "No JavaScript package manifest detected; skipping dependency install."
          fi

      - name: Install GIRL
        shell: bash
        run: go install "github.com/canadian-ai/girl/cmd/girl@${{ inputs.girl-version }}"

      - name: Run GIRL quality contract
        shell: bash
        run: girl check "${{ inputs.path }}" --ci
